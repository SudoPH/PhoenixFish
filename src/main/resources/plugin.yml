name: PhoenixFish
version: "${project.version}"
main: com.phoenix.fish.PhoenixFish
api-version: "1.21"
author: Sudo
description: Custom fishing system with optional XP and minigame.

# PlaceholderAPI must load before PhoenixFish so %phoenixfish_*% placeholders register at enable
softdepend:
  - PlaceholderAPI

# Paper automatically downloads these libraries at startup.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.slf4j:slf4j-jdk14:2.0.9

commands:
  phoenixfish:
    description: Main command for PhoenixFish (toggle fishing mode, catalog, skills, sell, tournaments and admin tools).
    usage: /phoenixfish <toggle | status | catalog | skills | sell | fix | tournament | giverod | givebait | addlevel>
    aliases: [pfish, pf]

permissions:
  # ---------- Player permissions ----------
  phoenixfish.use:
    description: Allows using the /phoenixfish fix command to fix own inventory.
    default: true
  phoenixfish.toggle:
    description: Allows switching between vanilla and PhoenixFish fishing modes (/phoenixfish toggle).
    # Only enforced when "fishing-mode.require-permission" is true in config.yml.
    # Admins with phoenixfish.admin can always toggle and manage other players.
    default: true
  phoenixfish.tournament.admin:
    description: Allows starting/stopping tournaments and setting tournament rewards.
    default: op

  # ---------- Admin permissions ----------
  phoenixfish.admin:
    description: Admin tools - fixall, giverod, givebait, viewing/switching/resetting other players' fishing mode.
    default: op