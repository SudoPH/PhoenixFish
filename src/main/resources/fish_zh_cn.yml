    - <dark_gray>» <aqua>少见
    - <gray>滑腻的蛇形鱼类，
    - <gray>栖息于近海水域。
    - ''
    - <dark_gray>层级：<white>2
  grouper:
    display-name: <#55FFFF>石斑鱼</#55FFFF>
