# ============================================================
#  PhoenixFish — Simplified Chinese Fish Definitions (zh_cn)
# ============================================================
#  v1.8.8 — Flat layout for backward compat with v1.3.5–v1.8.2 servers.
#  Contains FULLY TRANSLATED display-name + lore for 32 fish species.
#  Gameplay data (rarity, weight, price, biomes, material, cmd) stays
#  in the root-level fish.yml (data file).
# ============================================================

fishes:
  sea_bass:
    display-name: <#55FF55>鲈鱼</#55FF55>
    lore:
    - <dark_gray>» <gray>普通
    - <gray>活泼美味的鱼类，
    - <gray>栖息于近岸水域。
    - ''
    - <dark_gray>层级：<white>1
  anchovy:
    display-name: <#55FF55>凤尾鱼</#55FF55>
    lore:
    - <dark_gray>» <gray>普通
    - <gray>广受喜爱的鱼类，
    - <gray>常以大群游动。
    - ''
    - <dark_gray>层级：<white>1
  sardine:
    display-name: <#55FF55>沙丁鱼</#55FF55>
    lore:
    - <dark_gray>» <gray>普通
    - <gray>银色的小鱼，
    - <gray>常以密集鱼群游动。
    - ''
    - <dark_gray>层级：<white>1
  pufferfish:
    display-name: <#55FF55>河豚</#55FF55>
    lore:
    - <dark_gray>» <gray>普通
    - <gray>受威胁时会膨胀。
    - <gray>请小心处理。
    - ''
    - <dark_gray>层级：<white>1
  wild_salmon:
    display-name: <#55FF55>野生鲑鱼</#55FF55>
    lore:
    - <dark_gray>» <gray>普通
    - <gray>强壮的游泳者，
    - <gray>在河海之间洄游。
    - ''
    - <dark_gray>层级：<white>1
  mackerel:
