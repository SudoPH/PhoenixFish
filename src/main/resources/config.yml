# ==========================================
# PhoenixFish - Main Configuration
# ==========================================
# Supports TR and EN languages.
# Language files (messages_tr.yml, messages_en.yml) are generated automatically.

settings:
  # Set the plugin language (tr / en)
  language: "en"
  # Enable the interactive fishing minigame
  minigame-enabled: true
  discovery-enabled: true
  # Fix legacy items when opening chests/barrels
  fix-items-on-chest-open: true

# ==========================================
# Weather & Environment System
# ==========================================
# Increases luck based on weather conditions.
weather:
  # Luck bonus when it's raining (0.2 = +20% luck)
  rain-luck-bonus: 0.2
  # Luck bonus when it's thundering (0.5 = +50% luck). Greatly increases rare fish chances.
  storm-luck-bonus: 0.5

# ==========================================
# Sound System
# ==========================================
# Configure sounds for various events.
# Use valid Minecraft sound names (e.g., ENTITY_PLAYER_LEVELUP)
sounds:
  # Sound played when bait is consumed
  bait_consume: "ENTITY_ITEM_PICKUP"
  # Sound played when a new fish is discovered
  discover: "UI_TOAST_CHALLENGE_COMPLETE"
  # Sound played when items are fixed
  fix: "BLOCK_ANVIL_USE"
  # Sound played when items are sold successfully
  sell_success: "ENTITY_PLAYER_LEVELUP"

# ==========================================
# Minigame Settings
# ==========================================
# These values control the difficulty and mechanics of the fishing minigame.
# Note: The minigame updates every 2 ticks (10 times per second).
#
# --- DIFFICULTY GUIDE ---
# EASY:   rod-width: 3, progress-rate: 2.5, tension-increase-rate: 1.0
# MEDIUM: rod-width: 2, progress-rate: 1.5, tension-increase-rate: 1.5
# HARD:   rod-width: 1, progress-rate: 1.0, tension-increase-rate: 2.0
minigame:
  # The total width of the minigame area. (Lower = Easier to track the fish)
  area-width: 30
  # The half-width of the player's catching bar. (3 means 7 characters wide total. Higher = Easier)
  rod-width: 2
  # Chance for the fish to change direction (0.0 to 1.0. Lower = Easier)
  fish-move-chance: 0.6
  # How far the fish moves when it changes direction (Lower = Easier to follow)
  fish-move-distance: 2
  # How much progress is gained when the fish is inside the bar. (Higher = Easier. 10 seconds to win at 2.0)
  progress-rate: 2.0
  # How much tension increases when the fish is outside the bar. (Lower = Easier, line snaps slower)
  tension-increase-rate: 1.2
  # How much tension decreases when the fish is inside the bar. (Higher = Easier, recovers faster)
  tension-decrease-rate: 3.0

# ==========================================
# XP & Leveling System
# ==========================================
# If disabled, the plugin will run in fishing-only mode without levels or databases.
xp-system:
  enabled: true

  database:
    # Database type: sqlite or mysql
    type: sqlite
    # MySQL credentials (ignored if type is sqlite)
    # WARNING: Do not use default credentials on production servers!
    host: localhost
    port: 3306
    name: phoenix_db
    username: root
    password: ""

  # Adds a 2% (0.02) luck bonus per fishing level.
  # Example: A level 50 player gets +100% (x1.0 extra) luck.
  # Note: High values can break the late-game economy by making rare fish too common.
  level-luck-bonus: 0.02

# ==========================================
# Economy System (Internal)
# ==========================================
# Sells custom fish for internal balance.
# Final price = fish_price (from fish.yml) * fish_weight
economy:
  enabled: true

# ==========================================
# Tournament System
# ==========================================
# If disabled, admins cannot start tournaments via commands.
tournament:
  enabled: true

  # Rewards for the top 3 players.
  # %player% is replaced with the player's name.
  # Commands are executed by the console.
  rewards:
    1:
      # If an admin uses the "/phoenixfish tournament addreward 1" command while holding an item,
      # the plugin will automatically save a long encrypted string (Base64) here. Leave it empty ("") normally.
      item: ""
      # You can run console commands here (e.g., give money, permission, or items from other plugins).
      # You can use both 'item' and 'commands' at the same time!
      commands:
        - "eco give %player% 1000"
    2:
      item: ""
      commands:
        - "eco give %player% 500"
    3:
      item: ""
      commands:
        - "eco give %player% 250"
