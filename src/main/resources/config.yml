# ============================================================
#  PhoenixFish — Main Configuration
# ============================================================
#  Albion-style custom fishing system with optional XP,
#  discovery, minigame, economy, tournaments and records.
#
#  ── MODULAR DESIGN ──────────────────────────────────────────
#  Every feature below can be ENABLED or DISABLED independently.
#  Disabled features consume ZERO CPU/memory — they're not loaded.
#  Mix and match to fit your server's playstyle:
#
#    ✅ Sandbox server        → minigame: off, xp: off, economy: off
#    ✅ Progression server     → all features: on
#    ✅ Tournament-only server → tournament: on, everything else: off
#    ✅ Vanilla+ server        → fishing-mode.default-mode: vanilla
#
#  After editing this file, restart the server OR run:
#    /pf reload   — re-reads config, language files, fish/rods/baits/recipes
#
#  Supported languages: any code is accepted (en, tr, zh_cn, de, fr, ...).
#  The plugin auto-extracts bundled language files from the jar if they
#  are missing from the data folder. Missing message keys fall back to
#  English automatically (setDefaults mechanism).
# ============================================================

settings:
  # ── GLOBAL LANGUAGE ─────────────────────────────────────
  # Affects ALL player-facing messages, rod names, bait names, recipe names.
  # Any language code is accepted. The plugin looks for:
  #   messages_<lang>.yml  +  rods_<lang>.yml  +  baits_<lang>.yml
  #   +  custom_recipes_<lang>.yml  +  fish_<lang>.yml
  # If a file is missing, it falls back to the English version.
  language: "en"

  # ── FEATURE: Minigame ──────────────────────────────────
  # The interactive fishing minigame (moving bar + tension line).
  #   true  = players play the catching minigame
  #   false = catches resolve instantly, no minigame UI
  minigame-enabled: true

  # ── FEATURE: Discovery ─────────────────────────────────
  # First-time catches are added to the player's catalog.
  # Requires the XP/database system to be enabled.
  #   true  = undiscovered fish show as "???" in the catalog until caught
  #   false = everything is shown as discovered from the start
  discovery-enabled: true

  # ── FEATURE: Auto-fix Legacy Items ─────────────────────
  # Automatically fixes outdated rod & bait items when a player
  # opens a chest or barrel. Keep this ON after plugin updates
  # that change item formats.
  fix-items-on-chest-open: true

# ============================================================
#  Weather & Environment Bonuses
# ============================================================
#  These values add BONUS luck on top of the base luck while fishing.
#  Luck increases the chance of rarer fish.
#  0.2 = +20%, 0.5 = +50%, 0 = disabled
#  Set both to 0 to disable weather-based luck entirely.
weather:
  rain-luck-bonus: 0.2
  storm-luck-bonus: 0.5

# ============================================================
#  Sound System
# ============================================================
#  Sounds played for various plugin events.
#  Use valid Bukkit Sound enum names (e.g. ENTITY_PLAYER_LEVELUP).
#  If a name is invalid, the default sound is used and a warning
#  is printed in the console.
sounds:
  bait_consume: "ENTITY_ITEM_PICKUP"
  discover: "UI_TOAST_CHALLENGE_COMPLETE"
  fix: "BLOCK_ANVIL_USE"
  sell_success: "ENTITY_PLAYER_LEVELUP"
  mode_toggle: "UI_BUTTON_CLICK"

# ============================================================
#  FEATURE: Minigame Difficulty
# ============================================================
#  Controls the difficulty and mechanics of the fishing minigame.
#  Updates every 2 ticks (10 times per second).
#
#  ── DIFFICULTY GUIDE ────────────────────────────────────
#  EASY:   rod-width: 3, progress-rate: 2.5, tension-increase-rate: 1.0
#  MEDIUM: rod-width: 2, progress-rate: 1.5, tension-increase-rate: 1.5
#  HARD:   rod-width: 1, progress-rate: 1.0, tension-increase-rate: 2.0
minigame:
  area-width: 30
  rod-width: 2
  fish-move-chance: 0.6
  fish-move-distance: 2
  progress-rate: 2.0
  tension-increase-rate: 1.2
  tension-decrease-rate: 3.0

  # ── v1.3.5: Per-Rarity Difficulty Multipliers ──────────
  # Fish rarity: 1=Common, 2=Uncommon, 3=Rare, 4=Epic, 5=Legendary.
  # The multiplier scales the fish's fightStrength value.
  # Default 1.0 = old behavior (rarity has no effect on minigame).
  # Recommended: Epic +60%, Legendary +100% harder.
  rarity-difficulty-multipliers:
    1: 1.0
    2: 1.0
    3: 1.2
    4: 1.6
    5: 2.0

  # ── v1.3.5: Per-Rarity Tension Cap ─────────────────────
  # The line snaps when tension reaches this value.
  # Default 100.0 = old behavior (snaps at 100%).
  # Lower cap = less forgiving — epic/legendary fish forgive less.
  rarity-tension-cap:
    1: 100.0
    2: 100.0
    3: 100.0
    4: 90.0
    5: 80.0

# ============================================================
#  FEATURE: XP & Leveling System (MODULAR MASTER SWITCH)
# ============================================================
#  Master switch for the entire XP subsystem.
#  If disabled, the plugin runs in fishing-only mode:
#    ❌ no levels  ❌ no skills  ❌ no database  ❌ no discovery progress
#  If enabled, all sub-features below become active.
xp-system:
  enabled: true

  database:
    type: sqlite    # "sqlite" (single file, no setup) or "mysql"
    host: localhost
    port: 3306
    name: phoenix_db
    username: root
    password: ""

    # ── SSL Settings (MySQL only) ─────────────────────────
    # 1. PRODUCTION: use-ssl=true, verify-server-certificate=true
    # 2. SELF-SIGNED DEV: use-ssl=true, verify-server-certificate=false
    # 3. PLAINTEXT (localhost only!): use-ssl=false
    use-ssl: true
    verify-server-certificate: true

  # Adds a luck bonus per fishing level.
  # 0.02 = +2% per level. Level 50 → +100% extra luck.
  # WARNING: High values break the late-game economy (rare fish too common).
  level-luck-bonus: 0.02

  # ── FEATURE: Crafting XP Formula (Exponential) ─────────
  # XP required to advance from level N to N+1:
  #   requiredXp = base × level^exponent × tierMultiplier
  # Creates a smooth curve — early levels fast, late levels slow.
  #
  # Casual server:    base: 30, exponent: 1.3
  # Balanced (default): base: 50, exponent: 1.5
  # Hardcore server:   base: 80, exponent: 1.8
  crafting-xp:
    base: 50
    exponent: 1.5
    global-multiplier: 1.0    # 2.0 = double XP weekend, 0.5 = half XP

    # Multiplies required XP based on the player's level range.
    # Makes early game fast and late game slow.
    # To disable (flat formula): 1-100: 1.0
    tier-multipliers:
      1-10: 1.0     # Training — fast start
      11-30: 1.5    # Early game — steady pace
      31-60: 2.5    # Mid game — grind begins
      61-80: 4.0    # Late game — hard
      81-100: 6.0   # Endgame — takes months

  # ── FEATURE: Tier System (Albion-style) ────────────────
  # When enabled, crafting level determines which tier of equipment
  # you can craft. Higher tiers = better stats.
  #   false = all items have base stats, no tier colors
  #   true  = items are tiered by crafting level (see tiers below)
  tier-system:
    enabled: true
    tiers:
      1: { min-level: 1,   max-level: 9,   color: "<white>",                name: "Common" }
      2: { min-level: 10,  max-level: 24,  color: "<green>",                 name: "Uncommon" }
      3: { min-level: 25,  max-level: 39,  color: "<aqua>",                  name: "Rare" }
      4: { min-level: 40,  max-level: 54,  color: "<light_purple>",         name: "Epic" }
      5: { min-level: 55,  max-level: 69,  color: "<gold>",                  name: "Superior" }
      6: { min-level: 70,  max-level: 84,  color: "<#FF8C00>",               name: "Mystic" }
      7: { min-level: 85,  max-level: 94,  color: "<red>",                   name: "Legendary" }
      8: { min-level: 95,  max-level: 100, color: "<gradient:#9D00FF:#00CED1>", name: "Divine" }

  # Maximum level for each fishing skill (1-10, clamped by the plugin).
  # Skills: Fast Catcher, Master Hunter, Double Catch, Lucky Bait.
  skill-max-level: 5

  # ── v1.3.5: Config-Driven Skill Values ─────────────────
  # These values were previously hardcoded in source. Now they're
  # config-driven — changes take effect on /pf reload.
  # Defaults match the old hardcoded values (backward compatible).
  skill-per-level:
    fast-catcher-progress-bonus: 0.5    # added to minigame progress-rate per level
    master-hunter-luck-bonus: 0.02      # added to luck multiplier per level
    double-catch-chance-per-level: 0.10  # chance to catch 2 fish per level
    lucky-bait-chance-per-level: 0.20   # chance to not consume bait per level

  # ── v1.5.0 (F-4): Skill Re-Spec ────────────────────────
  # /pf respec           = reset YOUR skills, refund all skill points
  # /pf respec <player>  = (Admin) reset another player's skills
  #
  # Cost charged from the player's PhoenixFish balance:
  #   0.0 = free (default)
  #   100.0 = costs $100 per re-spec
  # Admins always re-spec for free.
  respec-cost: 0.0

# ============================================================
#  FEATURE: Economy System (Internal)
# ============================================================
#  Sells custom fish for the plugin's internal balance.
#  Final price = fish_price (from fish.yml) × fish_weight
#
#  This is NOT Vault — it uses PhoenixFish's own balance field
#  stored in the player_professions database table.
#
#   false = fish cannot be sold, /pf sell is disabled, no balance
#   true  = players can sell fish via /pf sell <all|hand|menu>
economy:
  enabled: true

# ============================================================
#  FEATURE: Tournament System
# ============================================================
#  Timed fishing competitions with rewards for the top players.
#  Scoring: rarity-weighted (Common=1, Uncommon=2, Rare=5, Epic=12, Legendary=25)
#
#   false = admins cannot start tournaments via commands
#   true  = tournaments can be started manually AND scheduled (see below)
tournament:
  enabled: true

  # ── v1.5.0 (F-1): Scheduled Recurring Tournaments ──────
  # Uncomment (remove the #) to enable automatic recurring tournaments.
  # Multiple schedules can coexist — e.g. daily + weekly both active.
  # The plugin calculates the delay until the next occurrence on startup.
  schedule:
    # Daily tournament — runs every day at the specified time.
    # daily:
    #   time: "20:00"           # 24-hour format (HH:MM)
    #   duration-minutes: 30

    # Weekly tournament — runs on the specified day of the week.
    # weekly:
    #   day: SATURDAY            # MONDAY, TUESDAY, ... SUNDAY
    #   time: "18:00"
    #   duration-minutes: 60

  # Rewards for the top 3 players.
  # %player% is replaced with the winner's name.
  # Commands are executed by the console.
  rewards:
    1:
      # If an admin uses "/pf tournament addreward 1"
      # while holding an item, the plugin auto-saves a
      # Base64-encoded string here. Leave it ("") normally.
      item: ""
      commands:
        - "eco give %player% 1000"
    2:
      item: ""
      commands:
        - "eco give %player% 500"
    3:
      item: ""
      commands:
        - "eco give %player% 250"

# ============================================================
#  FEATURE: Fishing Mode (Vanilla / PhoenixFish switching)
# ============================================================
#  Lets each player choose between the plugin's custom fishing
#  (minigame, custom fish, weights, records, baits, skills) and
#  Minecraft's vanilla fishing (loot tables, enchanted books, etc.)
#
#  Commands:
#    /pf toggle                  → switch your own mode
#    /pf toggle status           → show your current mode
#    /pf toggle status <player>  → (Admin) view a player
#    /pf toggle <player>         → (Admin) switch a player
#    /pf toggle reset <player>   → (Admin) reset to default
#
#   false = nobody can switch, everyone uses default-mode
#   true  = players can switch (subject to permission below)
fishing-mode:
  enabled: true

  # Starting mode for players who have NOT made a choice yet:
  #   custom  = plugin fishing (custom fish, minigame, baits, skills...)
  #   vanilla = vanilla Minecraft fishing (enchanted books, vanilla loot)
  default-mode: custom

  # If true, players need "phoenixfish.toggle" permission to switch.
  # Admins with "phoenixfish.admin" can always switch and manage others.
  require-permission: false

  # Cooldown between mode switches, in seconds (anti-spam).
  # 0 = disabled.
  toggle-cooldown: 5

  # If true, a server-wide announcement is sent when a player switches.
  broadcast-change: false

# ============================================================
#  QUICK REFERENCE — Feature Toggle Summary
# ============================================================
#  Feature                 │ Config Key                              │ Default
#  ────────────────────────┼─────────────────────────────────────────┼─────────
#  Minigame                │ settings.minigame-enabled               │ true
#  Discovery               │ settings.discovery-enabled              │ true
#  Auto-fix legacy items   │ settings.fix-items-on-chest-open        │ true
#  XP & Leveling (master)  │ xp-system.enabled                       │ true
#  Tier system             │ xp-system.tier-system.enabled           │ true
#  Economy (sell fish)     │ economy.enabled                          │ true
#  Tournaments             │ tournament.enabled                      │ true
#  Scheduled tournaments   │ tournament.schedule.daily/weekly        │ disabled
#  Fishing mode toggle     │ fishing-mode.enabled                    │ true
#  Weather luck bonuses    │ weather.rain-luck-bonus / storm-luck    │ 0.2 / 0.5
#  Skill re-spec           │ xp-system.respec-cost                   │ 0.0 (free)
#  Per-rarity difficulty   │ minigame.rarity-difficulty-multipliers   │ 1.0 each
#  Per-rarity tension cap  │ minigame.rarity-tension-cap              │ 100.0 each
# ============================================================
