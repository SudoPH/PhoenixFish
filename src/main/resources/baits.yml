    minigame:
      fight-strength-reduction: 0.10   # balığın fight strength değerini %10 azaltır
      fish-slow-bonus: 0.10             # balığın hareket şansını %10 azaltır
      progress-bonus: 0.2               # progressRate'e +0.2 ekler

  lunar_moth:
