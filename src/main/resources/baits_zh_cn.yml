# ==========================================
# PhoenixFish - 鱼饵配置 (中文版)
# ==========================================
# Bait IDs 必须唯一。ID 中不要有空格。
# target-rarity: 此鱼饵提升的鱼稀有度等级 (1-5)。
# chance-modifier: 应用于目标稀有度基础捕获几率的倍率。
# 注意：不建议超过 2.0，会破坏后期平衡。
# 推荐范围：1.1 到 1.8

baits:
  # ==========================================
  # 早期游戏 (普通 & 非普通)
  # ==========================================
  worm:
    display-name: "<#8B4513>普通蚯蚓</#8B4513>"
    material: STICK
    custom-model-data: 40001
    target-rarity: 1
    chance-modifier: 1.3
    lore:
      - "<gray>从泥土里挖出的简单蚯蚓。"
      - "<dark_gray>» <white>略微吸引普通鱼。"

  bread_crust:
    display-name: "<#FFDAB9>面包皮</#FFDAB9>"
    material: BREAD
    custom-model-data: 40002
    target-rarity: 1
    chance-modifier: 1.2
    lore:
      - "<gray>剩下的面包碎片。"
      - "<dark_gray>» <white>给饥饿鱼的廉价鱼饵。"

  # ==========================================
  # 早期游戏鱼饵 (level 2-7)
  # ==========================================
  minnow_bait:
    display-name: "<#A0A0A0>小鱼饵</#A0A0A0>"
    material: COD
    custom-model-data: 40011
    target-rarity: 1
    chance-modifier: 1.4
    lore:
      - "<gray>碎小鱼混骨粉。"
      - "<dark_gray>» <white>比蚯蚓稍好。"

  seaweed_wrap:
    display-name: "<#3CB371>海带包</#3CB371>"
    material: KELP
    custom-model-data: 40012
    target-rarity: 2
    chance-modifier: 1.25
    lore:
      - "<gray>湿海带编成香包。"
      - "<dark_gray>» <aqua>吸引非普通鱼。"

  bug_paste:
    display-name: "<#DAA520>虫糊</#DAA520>"
    material: HONEY_BOTTLE
    custom-model-data: 40013
    target-rarity: 2
    chance-modifier: 1.35
    lore:
      - "<gray>捣碎的虫子泡在甜蜂蜜里。"
      - "<dark_gray>» <aqua>对人臭不可闻，对鱼不可抗拒。"

  glowing_bait:
    display-name: "<aqua>荧光鱼饵</aqua>"
    material: SLIME_BALL
    custom-model-data: 40003
    target-rarity: 2
    chance-modifier: 1.4
    lore:
      - "<gray>虹彩光泽让鱼着迷。"
      - "<dark_gray>» <aqua>吸引非普通鱼。"

  enchanted_dough:
    display-name: "<#FFC0CB>附魔面团</#FFC0CB>"
    material: HONEYCOMB
    custom-model-data: 40004
    target-rarity: 2
    chance-modifier: 1.5
    lore:
      - "<gray>带点魔法的烤面团。"
      - "<dark_gray>» <aqua>非普通鱼的可靠选择。"

  # ==========================================
  # 中期游戏 (稀有)
  # ==========================================
  bloodied_flesh:
    display-name: "<red>血淋淋的肉</red>"
    material: ROTTEN_FLESH
    custom-model-data: 40005
    target-rarity: 3
    chance-modifier: 1.5
    lore:
      - "<gray>刺鼻气味让捕食者疯狂。"
      - "<dark_gray>» <red>吸引稀有鱼。"

  spider_silk:
    display-name: "<#F5F5DC>蜘蛛丝</#F5F5DC>"
    material: COBWEB
    custom-model-data: 40006
    target-rarity: 3
    chance-modifier: 1.6
    lore:
      - "<gray>编织的丝能缠住稀有猎物。"
      - "<dark_gray>» <red>稀有鱼的高级鱼饵。"

  # ==========================================
  # 后期游戏 (史诗)
  # ==========================================
  ocean_essence:
    display-name: "<#00CED1>海洋精华</#00CED1>"
    material: PRISMARINE_CRYSTALS
    custom-model-data: 40007
    target-rarity: 4
    chance-modifier: 1.6
    lore:
      - "<#00CED1>海洋的纯粹魔法。"
      - "<dark_gray>» <gold>吸引史诗鱼。"

  golden_roe:
    display-name: "<gold>金色鱼籽</gold>"
    material: EGG
    custom-model-data: 40008
    target-rarity: 4
    chance-modifier: 1.7
    lore:
      - "<gold>闪烁金光的稀有鱼卵。"
      - "<dark_gray>» <gold>对史诗鱼极具吸引力。"

  # ==========================================
  # 终局游戏 (传说)
  # ==========================================
  void_leech:
    display-name: "<dark_purple>虚空水蛭</dark_purple>"
    material: NETHERITE_SCRAP
    custom-model-data: 40009
    target-rarity: 5
    chance-modifier: 1.7
    lore:
      - "<dark_purple>来自虚空深处的寄生生物。"
      - "<dark_gray>» <light_purple>吸引传说鱼。"
    # v1.3.5 — 小游戏加成：仅在传说鱼 (rarity 5) 时生效
    minigame:
      fight-strength-reduction: 0.10   # 降低鱼 fight strength 10%
      fish-slow-bonus: 0.10             # 降低鱼移动几率 10%
      progress-bonus: 0.2               # progressRate +0.2

  lunar_moth:
    display-name: "<#C0C0C0>月蛾</#C0C0C0>"
    material: PHANTOM_MEMBRANE
    custom-model-data: 40010
    target-rarity: 5
    chance-modifier: 1.8
    lore:
      - "<#C0C0C0>从月光中汲取能量。"
      - "<dark_gray>» <light_purple>神话鱼的终极鱼饵。"
    minigame:
      fight-strength-reduction: 0.15
      fish-slow-bonus: 0.15
      progress-bonus: 0.3

  # ==========================================
  # 强化鱼饵 (Faz 0.8.0 — 阶梯装备)
  # ==========================================
  # 制作等级越高 = 鱼饵越好。
  # 所有 chance-modifier 值均可调整。
  # ==========================================

  enhanced_worm:
