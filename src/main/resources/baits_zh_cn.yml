    custom-model-data: 41006
    target-rarity: 5
    chance-modifier: 1.9
    lore:
      - "<dark_purple>来自虚空的寄生恐怖。"
      - "<dark_gray>» <light_purple>传说鱼无法抗拒。"

  # ==========================================
  # 填充鱼饵 (Faz 1.0.0 — 等级空白)
