# ============================================================
#  PhoenixFish — Simplified Chinese Baits Definitions (zh_cn)
# ============================================================
#  v1.8.8 — Flat layout. Fully translated display-name + lore for 28 baits.
# ============================================================

baits:
  worm:
    display-name: <#8B4513>普通蚯蚓</#8B4513>
    lore:
    - <gray>泥土中找到的简单蚯蚓。
    - <dark_gray>» <white>略微吸引普通鱼。
  bread_crust:
    display-name: <#FFDAB9>面包皮</#FFDAB9>
    lore:
    - <gray>剩余的面包碎块。
    - <dark_gray>» <white>吸引饥不择食的鱼的廉价饵。
  minnow_bait:
    display-name: <#A0A0A0>小鱼饵</#A0A0A0>
    lore:
    - <gray>碎小鱼混骨粉。
    - <dark_gray>» <white>比蚯蚓稍好。
  seaweed_wrap:
    display-name: <#3CB371>海藻包</#3CB371>
    lore:
    - <gray>湿海藻编成的芬芳卷。
    - <dark_gray>» <aqua>吸引少见鱼。
  bug_paste:
    display-name: <#DAA520>虫膏</#DAA520>
    lore:
    - <gray>碎虫混合甜美汁液。
    - <dark_gray>» <aqua>吸引少见鱼。
  glowing_bait:
    display-name: <#FFFF00>发光饵</#FFFF00>
    lore:
    - <gray>黑暗中闪烁的诱饵。
    - <dark_gray>» <aqua>吸引少见鱼。
  enchanted_dough:
    display-name: <#FFB6C1>附魔面团</#FFB6C1>
    lore:
    - <gray>魔法灌注的面包面团。
    - <dark_gray>» <aqua>吸引少见鱼。
  bloodied_flesh:
    display-name: <#8B0000>血肉</#8B0000>
    lore:
    - <gray>浸透鲜血的生肉。
    - <dark_gray>» <red>吸引稀有掠食鱼。
  spider_silk:
    display-name: <#F5F5DC>蛛丝</#F5F5DC>
    lore:
    - <gray>洞穴蜘蛛编织的丝线。
    - <dark_gray>» <red>吸引稀有鱼。
  ocean_essence:
    display-name: <#00CED1>海洋精华</#00CED1>
    lore:
    - <gray>从深海蒸馏的精华。
    - <dark_gray>» <red>吸引稀有鱼。
  golden_roe:
    display-name: <#FFD700>金鱼子</#FFD700>
    lore:
    - <gray>泛着金光的稀有鱼卵。
    - <dark_gray>» <red>吸引稀有鱼。
  void_leech:
    display-name: <#9D00FF>虚空水蛭</#9D00FF>
    lore:
    - <gray>来自世界间虚空的水蛭。
    - <dark_gray>» <gold>吸引史诗鱼。
  lunar_moth:
    display-name: <#C0C0C0>月蛾</#C0C0C0>
    lore:
    - <gray>泛着月光的飞蛾。
    - <dark_gray>» <gold>吸引史诗鱼。
  enhanced_worm:
    display-name: <#8B4513>强化蚯蚓</#8B4513>
    lore:
    - <gray>注入魔法能量的蚯蚓。
    - <dark_gray>» <white>强力吸引普通鱼。
  enhanced_glowing_bait:
    display-name: <#FFFF00>强化发光饵</#FFFF00>
    lore:
    - <gray>更亮、更持久的发光诱饵。
    - <dark_gray>» <aqua>强力吸引少见鱼。
  enhanced_bloodied_flesh:
    display-name: <#8B0000>强化血肉</#8B0000>
    lore:
    - <gray>浸入稀有怪物鲜血的肉。
    - <dark_gray>» <red>强力吸引稀有鱼。
  enhanced_ocean_essence:
    display-name: <#00CED1>强化海洋精华</#00CED1>
    lore:
    - <gray>从深渊萃取的纯净精华。
    - <dark_gray>» <red>强力吸引稀有鱼。
  enhanced_golden_roe:
    display-name: <#FFD700>强化金鱼子</#FFD700>
    lore:
    - <gray>精炼后闪耀的金鱼子。
    - <dark_gray>» <red>强力吸引稀有鱼。
  enhanced_void_leech:
    display-name: <#9D00FF>强化虚空水蛭</#9D00FF>
    lore:
    - <gray>受虚空能量强化的水蛭。
    - <dark_gray>» <gold>强力吸引史诗鱼。
  moss_bait:
    display-name: <#6B8E23>苔藓饵</#6B8E23>
    lore:
    - <gray>潮湿洞穴苔藓一束。
    - <dark_gray>» <aqua>吸引少见洞穴鱼。
  glow_berry_bait:
    display-name: <#FF8C00>发光浆果饵</#FF8C00>
    lore:
    - <gray>发光浆果捣成的黏糊饵。
    - <dark_gray>» <aqua>吸引少见洞穴鱼。
  crimson_bait:
    display-name: <#DC143C>绯红饵</#DC143C>
    lore:
    - <gray>绯红森林生物的肉。
    - <dark_gray>» <red>吸引稀有下界鱼。
  ender_bait:
    display-name: <#40E0D0>末影饵</#40E0D0>
    lore:
    - <gray>注入末影能量的珍珠碎片。
    - <dark_gray>» <gold>吸引史诗末地鱼。
  blaze_bait:
    display-name: <#FFA500>烈焰饵</#FFA500>
    lore:
    - <gray>烈焰粉融蜡制成。
    - <dark_gray>» <gold>吸引史诗下界鱼。
  shulker_bait:
    display-name: <#C9A0DC>潜影贝饵</#C9A0DC>
    lore:
    - <gray>残留能量的潜影贝壳碎片。
    - <dark_gray>» <light_purple>吸引传说末地鱼。
  wither_bait:
    display-name: <#4A4A4A>凋灵饵</#4A4A4A>
    lore:
    - <gray>凋灵本身的颅骨粉末。
    - <dark_gray>» <light_purple>吸引传说下界鱼。
  echo_bait:
    display-name: <#FFFACD>幽响饵</#FFFACD>
    lore:
    - <gray>幽响碎片封入黏树脂。
    - <dark_gray>» <light_purple>吸引传说深海鱼。
  nether_star_bait:
    display-name: <#F8F8FF>下界星饵</#F8F8FF>
    lore:
    - <gray>散发能量的下界星碎片。
    - <dark_gray>» <light_purple>吸引最稀有的传说鱼。
