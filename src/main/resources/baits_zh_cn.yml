    target-rarity: 4
    chance-modifier: 1.75
    lore:
      - "<#00CED1>深海精华的蒸馏物。"
      - "<dark_gray>» <gold>强力吸引史诗鱼。"

  enhanced_golden_roe:
    display-name: "<gold><italic>光辉金色鱼籽</italic></gold>"
    material: EGG
    custom-model-data: 41005
    target-rarity: 4
    chance-modifier: 1.85
    lore:
      - "<gold>太阳祝福的金色鱼卵。"
      - "<dark_gray>» <gold>对史诗鱼有虹彩吸引力。"

  enhanced_void_leech:
    display-name: "<dark_purple><italic>深渊虚空水蛭</italic></dark_purple>"
