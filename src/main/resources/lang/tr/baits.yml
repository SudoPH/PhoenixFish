    - <dark_gray>» <white>Sıradan balıkları çeker.
  glow_berry_bait:
    display-name: <#FF8C00>Işıltı Meyvesi Yemi</#FF8C00>
    lore:
    - <gray>Tatlı ve ışıl ışıl.
    - <dark_gray>» <aqua>Az bulunur balıkları çeker.
  crimson_bait:
    display-name: <#DC143C>Kızıl Yem</#DC143C>
    lore:
    - <gray>Kızıl ormanlardan gelir.
    - <dark_gray>» <red>Nadir balıkları çeker.
  ender_bait:
    display-name: <#40E0D0>Ender Yemi</#40E0D0>
    lore:
    - <gray>Balıkları telepatik yolla cezbeder.
    - <dark_gray>» <red>Nadir balıkları çeker.
  blaze_bait:
    display-name: <#FFA500>Blaze Yemi</#FFA500>
