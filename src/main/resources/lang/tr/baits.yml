    - <dark_gray>» <light_purple>Efsanevi balıkları çeker.
  echo_bait:
    display-name: <#FFFACD>Eko Yemi</#FFFACD>
    lore:
    - <gray>Derin karanlıktan gelen fısıltılar.
    - <dark_gray>» <light_purple>Efsanevi balıklar için vazgeçilmezdir.
  nether_star_bait:
    display-name: <#F8F8FF>Nether Yıldızı Yemi</#F8F8FF>
    lore:
    - <white>Yoğunlaştırılmış yıldız enerjisi.
    - <dark_gray>» <light_purple>Mitik balıklar için en üstün yem.