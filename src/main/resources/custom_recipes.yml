  # FISHING RODS (Tiered Progression)
  # ==========================================

  # 1. Hardwood Rod (Starter Rod)
  hardwood_rod:
    result:
      material: FISHING_ROD
      custom-model-data: 20001
      display-name: "<#D2B48C>Hardwood Rod</#D2B48C>"
      luck-multiplier: 1.1
      lore:
        - "<dark_gray>» <gray>Starter"
        - "<gray>Made of compressed wood,"
        - "<gray>a cheap but functional rod."
        - ""
        - "<dark_gray>Luck Multiplier: <white>x1.1"
    crafting-level-requirement: 1
    xp-reward: 5
    shape:
      - "  S"
      - " ST"
      - "S  "
    ingredients:
      S:
        material: STICK
      T:
        material: STRING

