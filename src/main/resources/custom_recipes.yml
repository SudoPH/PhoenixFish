# ==========================================
# PhoenixFish - Custom Crafting Recipes
# ==========================================
# Recipe IDs must be unique.
# Ingredients can be vanilla materials or custom items.
# For custom items, only 'material' and 'custom-model-data' are required to match.
#
# YENİ: crafting-level-requirement = Bu tarifi CRAFT ETMEK için gereken minimum Zanaat Seviyesi.
# YENİ: xp-reward = Bu tarifi yapınca verilecek Olta Craft XP'si.

recipes:
  # ==========================================
  # FISHING RODS (Tiered Progression)
  # ==========================================

  # 1. Hardwood Rod (Starter Rod)
  hardwood_rod:
    result:
      material: FISHING_ROD
      custom-model-data: 20001
      display-name: "<#D2B48C>Hardwood Rod</#D2B48C>"
      luck-multiplier: 1.1
      lore:
        - "<dark_gray>» <gray>Starter"
        - "<gray>Made of compressed wood,"
        - "<gray>a cheap but functional rod."
        - ""
        - "<dark_gray>Luck Multiplier: <white>x1.1"
    crafting-level-requirement: 1
    xp-reward: 5
    shape:
      - "  S"
      - " ST"
      - "S  "
    ingredients:
      S:
        material: STICK
      T:
        material: STRING

  # 2. Iron Rod (Upgrades from Hardwood)
  iron_rod:
    result:
      material: FISHING_ROD
      custom-model-data: 20002
      display-name: "<white>Iron Rod</white>"
      luck-multiplier: 1.2
      lore:
        - "<dark_gray>» <gray>Common"
        - "<gray>Reinforced with iron bars."
        - "<gray>A sturdy rod that resists line breaks."
        - ""
        - "<dark_gray>Luck Multiplier: <white>x1.2"
    crafting-level-requirement: 10
    xp-reward: 15
    shape:
      - "  I"
      - " IR"
      - "R  "
    ingredients:
      I:
        material: IRON_INGOT
      R:
        material: FISHING_ROD
        custom-model-data: 20001

  # 3. Gold Rod (Upgrades from Iron)
  gold_rod:
    result:
      material: FISHING_ROD
      custom-model-data: 20003
      display-name: "<gold>Gold Rod</gold>"
      luck-multiplier: 1.35
      lore:
        - "<dark_gray>» <gold>Rare"
        - "<gold>Gold plating attracts stronger magic."
        - "<gray>Provides high luck but is slightly fragile."
        - ""
        - "<dark_gray>Luck Multiplier: <gold>x1.35"
    crafting-level-requirement: 20
    xp-reward: 30
    shape:
      - "  G"
      - " GR"
      - "R  "
    ingredients:
      G:
        material: GOLD_INGOT
      R:
        material: FISHING_ROD
        custom-model-data: 20002

  # 4. Diamond Rod (Upgrades from Gold)
