# ==========================================
# PhoenixFish - Custom Crafting Recipes
# ==========================================
# Recipe IDs must be unique.
# Ingredients can be vanilla materials or custom items.
# For custom items, only 'material' and 'custom-model-data' are required to match.
#
# YENİ: crafting-level-requirement = Bu tarifi CRAFT ETMEK için gereken minimum Zanaat Seviyesi.
# YENİ: xp-reward = Bu tarifi yapınca verilecek Olta Craft XP'si.

