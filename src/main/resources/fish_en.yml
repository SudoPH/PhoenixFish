# ============================================================
#  PhoenixFish — English Fish Definitions (en)
# ============================================================
#  v1.8.8 — Flat layout for backward compat with v1.3.5–v1.8.2 servers.
#  Contains display-name + lore for 32 fish species.
#  Gameplay data (rarity, weight, price, biomes, material, cmd) stays
#  in the root-level fish.yml (data file).
#  
#  The preferred layout is /lang/en/fish.yml (nested). This flat
#  file is loaded as a fallback if the nested file is missing.
# ============================================================

