# ==========================================
# PhoenixFish - 自定义鱼竿 (中文版)
# ==========================================
# Rod IDs must be unique and match the IDs in custom_recipes.yml if applicable.
# luck-multiplier: 提高稀有鱼出现的几率。
# 警告：插件使用指数级稀有度计算 (luck^(rarity-1))。
# 不要将此值设置超过 3.0，否则稀有鱼会变得过于常见，破坏经济！
# (1.0 = 普通, 1.5 = 良好, 2.0 = 终局装备)
#
# NEW: fishing-level-requirement = 使用此鱼竿所需的最低钓鱼等级。
# (1 = 任何人可用, 100 = 仅满级玩家)

rods:
  # 默认原版鱼竿（无 custom-model-data）
  default_rod:
    display-name: "<white>旧鱼竿</white>"
    material: FISHING_ROD
    custom-model-data: 0
    luck-multiplier: 1.0
    fishing-level-requirement: 1 # 任何人可用
    lore:
      - "<dark_gray>» <gray>标准"
      - "<gray>一根普通的鱼竿。"
      - ""
      - "<dark_gray>运气倍率：<white>x1.0"
      - "<dark_gray>所需钓鱼等级：<white>1"
    # v1.3.5 — 小游戏加成（默认 = 无效果，保持旧行为）
    minigame:
      bar-width-bonus: 0
      progress-rate-bonus: 0.0
      tension-resistance: 0.0
      fish-slow-chance: 1.0

  # Tier 1 鱼竿
  hardwood_rod:
