# ==========================================
# PhoenixFish - Custom Fish Configuration
# ==========================================
# Fish IDs must be unique. Do not use spaces in IDs.
# rarity: Affects luck probability and bait matching (1-5).
# weight: Base spawn weight (higher = more common).
# base-speed: Movement speed during the minigame.
# fight-strength: Affects tension increase rate during the minigame.
# xp-reward: XP given to the player upon catching (if XP system is enabled).

